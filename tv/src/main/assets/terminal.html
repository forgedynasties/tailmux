<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  /* ---- riced: Tokyo Night ---- */
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 400;
    src: url('jbmono-regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 700;
    src: url('jbmono-bold.woff2') format('woff2');
  }

  :root {
    --bg: #1a1b26;
    --bg2: #16161e;
    --fg: #c0caf5;
    --accent: #7aa2f7;
    --accent2: #bb9af7;
    --green: #9ece6a;
    --margin: 26px;
  }

  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg2);
    overflow: hidden;
    cursor: none;
  }

  /* soft vignette so edges feel intentional even under TV overscan */
  #frame {
    position: fixed; inset: 0;
    /* small extra at the bottom so the tmux status bar clears overscan */
    padding: var(--margin) var(--margin) calc(var(--margin) + 8px) var(--margin);
    box-sizing: border-box;
    background:
      radial-gradient(120% 120% at 50% 0%, #1f2233 0%, var(--bg) 55%, var(--bg2) 100%);
    transition: padding .12s ease;
  }

  #term {
    position: relative;
    height: 100%; width: 100%;
    border: 1px solid #2a2e42;
    border-radius: 12px;
    padding: 14px 16px;
    box-sizing: border-box;
    background: rgba(26,27,38,0.92);
    box-shadow:
      0 0 0 1px rgba(122,162,247,0.06),
      0 18px 60px rgba(0,0,0,0.55),
      inset 0 0 60px rgba(122,162,247,0.04);
    overflow: hidden;
  }
  .xterm { height: 100%; }
  .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }

  /* top-left session pill */
  #pill {
    position: fixed;
    left: calc(var(--margin) + 14px);
    top: calc(var(--margin) - 12px);
    z-index: 40;
    font: 600 12px/1 'JetBrains Mono', monospace;
    color: #0b0f12;
    background: linear-gradient(90deg, var(--green), var(--accent));
    padding: 5px 10px 6px;
    border-radius: 999px;
    letter-spacing: .5px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    opacity: .95;
  }
  #pill b { color:#0b0f12; }

  /* center flash hint (pane moves / zoom) */
  #hint {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    z-index: 50;
    font: 700 40px/1 'JetBrains Mono', monospace;
    color: var(--fg);
    background: rgba(22,22,30,.82);
    border: 1px solid #33467c;
    padding: 20px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(122,162,247,.1);
    opacity: 0; pointer-events: none;
    transition: opacity .12s ease, transform .12s ease;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #hint small { display:block; text-align:center; margin-top:8px; font-size:15px; font-weight:400; color:#7f88b3; }

  /* bottom feature bar */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 60;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(13,14,20,.97), rgba(13,14,20,.0));
    transform: translateY(120%);
    transition: transform .16s ease;
  }
  #bar.show { transform: translateY(0); }
  .item {
    font: 600 15px/1 'JetBrains Mono', monospace;
    color: #9aa5ce;
    background: #20233a;
    border: 1px solid #2a2e46;
    padding: 12px 16px;
    border-radius: 10px;
    min-width: 44px; text-align: center;
    transition: all .1s ease;
  }
  .item.sel {
    color: #0b0f12;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-color: transparent;
    box-shadow: 0 0 0 2px rgba(122,162,247,.35), 0 8px 24px rgba(0,0,0,.5);
    transform: translateY(-3px);
  }

  /* ---- full-screen launcher menu (hosts / sessions) ---- */
  #menu {
    position: fixed; inset: 0; z-index: 70;
    display: none;
    background: radial-gradient(120% 120% at 50% 0%, #1f2233 0%, #16161e 70%, #0d0e14 100%);
    padding: 6vh 8vw;
    box-sizing: border-box;
    overflow: hidden;
  }
  #menu.show { display: block; }
  #menuTitle {
    font: 700 30px/1 'JetBrains Mono', monospace;
    color: #c0caf5; margin-bottom: 4px;
  }
  #menuTitle b { color: var(--accent); }
  #menuHint { font: 400 14px/1.4 'JetBrains Mono', monospace; color: #7f88b3; margin-bottom: 22px; }
  #menuList { display: flex; flex-direction: column; gap: 10px; max-height: 74vh; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    border-radius: 12px;
    background: #1b1d2c;
    border: 1px solid #262a40;
    font: 500 20px/1.2 'JetBrains Mono', monospace;
    color: #aab2d8;
    transition: transform .08s ease, background .08s ease;
  }
  .row.sel {
    background: linear-gradient(90deg, rgba(122,162,247,.22), rgba(187,154,247,.10));
    border-color: var(--accent);
    color: #eaf0ff;
    transform: translateX(6px);
    box-shadow: 0 8px 26px rgba(0,0,0,.5);
  }
  .row .ico { width: 30px; text-align: center; font-size: 22px; }
  .row .main { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .row .sub { font-size: 13px; color: #6f78a0; font-weight: 400; }
  .row.sel .sub { color: #b7c0ea; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3f57; flex: none; }
  .dot.on { background: #9ece6a; box-shadow: 0 0 8px #9ece6a; }
  .dot.off { background: #414868; }

  /* ---- phone-pairing screen ---- */
  #pair {
    position: fixed; inset: 0; z-index: 80; display: none;
    background: radial-gradient(120% 120% at 50% 0%, #1f2233 0%, #16161e 70%, #0d0e14 100%);
    align-items: center; justify-content: center;
  }
  #pair.show { display: flex; }
  #pairCard {
    background: #1b1d2c; border: 1px solid #2a2e46; border-radius: 20px;
    padding: 40px 48px; text-align: center; max-width: 720px;
    box-shadow: 0 20px 70px rgba(0,0,0,.6);
  }
  #pairTitle { font: 700 34px/1 'JetBrains Mono', monospace; color: #c0caf5; margin-bottom: 12px; }
  #pairSub { font: 400 17px/1.5 'JetBrains Mono', monospace; color: #8b93bd; margin-bottom: 26px; }
  #pairQr {
    width: 300px; height: 300px; border-radius: 14px; background: #fff;
    padding: 12px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #pairUrl {
    margin-top: 20px; font: 600 24px/1 'JetBrains Mono', monospace;
    color: #7aa2f7; letter-spacing: .5px;
  }
  #pairFoot { margin-top: 22px; font: 400 15px/1 'JetBrains Mono', monospace; color: #6f78a0; }
  #pairFoot b { color: #9ece6a; }

  /* ---- busy / status overlay ---- */
  #busy {
    position: fixed; inset: 0; z-index: 90; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: rgba(13,14,20,.62);
  }
  #busy.show { display: flex; }
  .spinner {
    width: 54px; height: 54px; border-radius: 50%;
    border: 5px solid #2a2e46; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  #busy.err .spinner { border: 5px solid #4b2230; border-top-color: #f7768e; animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #busyMsg { font: 500 20px/1.4 'JetBrains Mono', monospace; color: #c0caf5; text-align: center; max-width: 70vw; }
  #busy.err #busyMsg { color: #f7768e; }
</style>
</head>
<body>
  <div id="frame"><div id="term"></div></div>
  <div id="pill">▸ <b id="pillname">ali</b></div>
  <div id="hint"></div>
  <div id="bar"></div>

  <div id="menu">
    <div id="menuTitle"></div>
    <div id="menuHint"></div>
    <div id="menuList"></div>
  </div>

  <div id="busy"><div class="spinner"></div><div id="busyMsg"></div></div>

  <div id="pair">
    <div id="pairCard">
      <div id="pairTitle">Connect your tailnet</div>
      <div id="pairSub">Scan with your phone and paste your Tailscale token there — no typing on the TV.</div>
      <img id="pairQr" src="" alt="">
      <div id="pairUrl"></div>
      <div id="pairFoot">or press <b>OK</b> to type the token on the TV</div>
    </div>
  </div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
  (function () {
    var term, fit, ready = false;

    var THEME = {
      background: '#1a1b26', foreground: '#c0caf5',
      cursor: '#c0caf5', cursorAccent: '#1a1b26', selectionBackground: '#33467c',
      black: '#15161e', red: '#f7768e', green: '#9ece6a', yellow: '#e0af68',
      blue: '#7aa2f7', magenta: '#bb9af7', cyan: '#7dcfff', white: '#a9b1d6',
      brightBlack: '#414868', brightRed: '#f7768e', brightGreen: '#9ece6a',
      brightYellow: '#e0af68', brightBlue: '#7aa2f7', brightMagenta: '#bb9af7',
      brightCyan: '#7dcfff', brightWhite: '#c0caf5'
    };

    // feature bar actions (id, label). Native reads selection via barSel().
    var ACTIONS = [
      {id:'font_dec',  l:'A−'},
      {id:'font_inc',  l:'A+'},
      {id:'margin_dec',l:'⤢−'},
      {id:'margin_inc',l:'⤢+'},
      {id:'win_prev',  l:'◀W'},
      {id:'win_next',  l:'W▶'},
      {id:'new_win',   l:'＋W'},
      {id:'scroll',    l:'Scroll'},
      {id:'esc',       l:'Esc'},
      {id:'tab',       l:'Tab'},
      {id:'ctrlc',     l:'^C'},
      {id:'kbd',       l:'⌨'},
      {id:'detach',    l:'Detach'}
    ];
    var barSelIdx = 0;

    function buildBar() {
      var bar = document.getElementById('bar');
      bar.innerHTML = '';
      ACTIONS.forEach(function (a, i) {
        var d = document.createElement('div');
        d.className = 'item' + (i === barSelIdx ? ' sel' : '');
        d.id = 'it' + i;
        d.textContent = a.l;
        bar.appendChild(d);
      });
    }
    function paintBar() {
      ACTIONS.forEach(function (a, i) {
        var el = document.getElementById('it' + i);
        if (el) el.className = 'item' + (i === barSelIdx ? ' sel' : '');
      });
      var sel = document.getElementById('it' + barSelIdx);
      if (sel && sel.scrollIntoView) sel.scrollIntoView({block:'nearest', inline:'center'});
    }

    var hintTimer = null;
    function flash(big, small) {
      var h = document.getElementById('hint');
      h.innerHTML = big + (small ? '<small>' + small + '</small>' : '');
      h.classList.add('show');
      if (hintTimer) clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ h.classList.remove('show'); }, 900);
    }

    function reportSize() {
      if (!term) return;
      try { Bridge.resize(term.cols, term.rows); } catch (e) {}
    }
    function doFit() {
      try { fit.fit(); } catch (e) {}
      reportSize();
    }

    function b64ToBytes(b64) {
      var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
      for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // ---- API called FROM native ----
    window.API = {
      write: function (b64) { if (term) term.write(b64ToBytes(b64)); },
      setFont: function (px) {
        term.options.fontSize = px;
        doFit();
        flash('A ' + px + 'px');
      },
      setMargin: function (px) {
        document.documentElement.style.setProperty('--margin', px + 'px');
        setTimeout(doFit, 140);
        flash('margin ' + px);
      },
      refit: doFit,
      showBar: function (on) {
        document.getElementById('bar').classList.toggle('show', !!on);
        if (on) paintBar();
      },
      barMove: function (d) {
        barSelIdx = (barSelIdx + d + ACTIONS.length) % ACTIONS.length;
        paintBar();
      },
      barSel: function () { return ACTIONS[barSelIdx].id; },
      flash: flash,
      setSession: function (n) { document.getElementById('pillname').textContent = n; },

      // ---- launcher menu ----
      showMenu: function (title, hint, itemsJson) {
        menuItems = JSON.parse(itemsJson);
        menuIdx = 0;
        document.getElementById('menuTitle').innerHTML = title;
        document.getElementById('menuHint').textContent = hint || '';
        var list = document.getElementById('menuList');
        list.innerHTML = '';
        menuItems.forEach(function (it, i) {
          var row = document.createElement('div');
          row.className = 'row' + (i === menuIdx ? ' sel' : '');
          row.id = 'row' + i;
          var dot = it.dot ? '<div class="dot ' + it.dot + '"></div>' : '<div style="width:10px"></div>';
          var sub = it.sub ? '<div class="sub">' + it.sub + '</div>' : '';
          row.innerHTML = dot +
            '<div class="ico">' + (it.ico || '') + '</div>' +
            '<div class="main"><div>' + it.label + '</div>' + sub + '</div>';
          list.appendChild(row);
        });
        document.getElementById('menu').classList.add('show');
      },
      hideMenu: function () { document.getElementById('menu').classList.remove('show'); },
      menuMove: function (d) {
        if (!menuItems.length) return;
        menuIdx = (menuIdx + d + menuItems.length) % menuItems.length;
        menuItems.forEach(function (it, i) {
          var el = document.getElementById('row' + i);
          if (el) el.className = 'row' + (i === menuIdx ? ' sel' : '');
        });
        var sel = document.getElementById('row' + menuIdx);
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
      },
      menuSel: function () { return menuItems.length ? menuItems[menuIdx].id : ''; },

      // ---- phone pairing ----
      showPair: function (url, qrDataUri) {
        document.getElementById('pairUrl').textContent = url;
        document.getElementById('pairQr').src = qrDataUri;
        document.getElementById('pair').classList.add('show');
      },
      hidePair: function () { document.getElementById('pair').classList.remove('show'); },

      // ---- busy / error overlay ----
      busy: function (msg) {
        var b = document.getElementById('busy');
        b.classList.remove('err'); b.classList.add('show');
        document.getElementById('busyMsg').textContent = msg;
      },
      error: function (msg) {
        var b = document.getElementById('busy');
        b.classList.add('err'); b.classList.add('show');
        document.getElementById('busyMsg').textContent = msg;
      },
      idle: function () { document.getElementById('busy').classList.remove('show'); }
    };

    var menuItems = [], menuIdx = 0;

    function boot() {
      term = new Terminal({
        allowProposedApi: true,
        fontFamily: '"JetBrains Mono", monospace',
        fontSize: 17,
        fontWeight: 400,
        fontWeightBold: 700,
        lineHeight: 1.12,
        letterSpacing: 0,
        cursorBlink: true,
        cursorStyle: 'block',
        scrollback: 5000,
        theme: THEME,
        allowTransparency: true
      });
      fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('term'));
      buildBar();
      doFit();

      term.onData(function (d) { try { Bridge.input(d); } catch (e) {} });
      window.addEventListener('resize', doFit);

      ready = true;
      try { Bridge.ready(); } catch (e) {}
    }

    // wait for the bundled font so cell metrics are correct
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('400 17px "JetBrains Mono"'),
        document.fonts.load('700 17px "JetBrains Mono"')
      ]).then(boot).catch(boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
