<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  /* ---- riced: Tokyo Night ---- */
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 400;
    src: url('jbmono-regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 700;
    src: url('jbmono-bold.woff2') format('woff2');
  }

  :root {
    --bg:#100F0D; --surface:#1A1915; --surface-2:#24221A;
    --line:#34322A; --line-2:#4A473C;
    --text:#F3EFE4; --muted:#ABA593; --faint:#77715F;
    --accent:#FF5A1F; --accent-soft:rgba(255,90,31,.18); --ink:#140A05;
    --online:#4BC55E; --offline:#45413A; --danger:#FF6B5A;
    --ui:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:0px; --bw:2px; --margin:26px;
  }
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); overflow:hidden; cursor:none; font-family:var(--ui);
  }
  #frame {
    position:fixed; inset:0;
    padding:var(--margin) var(--margin) calc(var(--margin) + 8px) var(--margin);
    box-sizing:border-box; background:var(--bg); transition:padding .12s ease;
  }
  #term {
    position:relative; height:100%; width:100%;
    border:var(--bw) solid var(--line); border-radius:var(--r);
    padding:14px 16px; box-sizing:border-box; background:var(--bg); overflow:hidden;
  }
  .xterm { height:100%; }
  .xterm-viewport::-webkit-scrollbar { width:0; height:0; }

  #pill {
    position:fixed; left:calc(var(--margin) + 12px); top:calc(var(--margin) - 14px);
    z-index:40; font:700 13px/1 var(--mono); color:var(--ink);
    background:var(--accent); padding:6px 12px; border-radius:var(--r); letter-spacing:.5px;
  }
  #pill b { color:var(--ink); }

  #hint {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    z-index:50; font:800 40px/1 var(--mono); color:var(--text);
    background:var(--surface); border:var(--bw) solid var(--line); padding:20px 30px; border-radius:var(--r);
    opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease; white-space:nowrap;
  }
  #hint.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #hint small { display:block; text-align:center; margin-top:8px; font:600 15px var(--mono); color:var(--muted); }

  #bar {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:var(--bw) solid var(--line);
    transform:translateY(120%); transition:transform .16s ease;
  }
  #bar.show { transform:translateY(0); }
  .item {
    font:700 15px/1 var(--mono); color:var(--text);
    background:var(--surface-2); border:var(--bw) solid var(--line);
    padding:12px 16px; border-radius:var(--r); min-width:44px; text-align:center; transition:all .1s ease;
  }
  .item.sel { color:var(--ink); background:var(--accent); border-color:var(--accent); transform:translateY(-3px); }

  #menu {
    position:fixed; inset:0; z-index:70; display:none; background:var(--bg);
    padding:6vh 8vw; box-sizing:border-box; overflow:hidden;
  }
  #menu.show { display:block; }
  #menuTitle { font:800 32px/1 var(--ui); color:var(--text); text-transform:uppercase; letter-spacing:-.01em; margin-bottom:6px; }
  #menuTitle b { color:var(--accent); }
  #menuHint { font:700 14px/1.4 var(--mono); color:var(--faint); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:22px; }
  #menuList { display:flex; flex-direction:column; gap:10px; max-height:74vh; overflow:hidden; }
  .row {
    display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:var(--r);
    background:var(--surface); border:var(--bw) solid var(--line);
    font:700 20px/1.2 var(--ui); color:var(--text); transition:transform .08s ease, background .08s ease;
  }
  .row.sel { background:var(--accent); border-color:var(--accent); color:var(--ink); transform:translateX(6px); }
  .row .ico { width:30px; text-align:center; font-size:22px; color:var(--muted); }
  .row.sel .ico { color:var(--ink); }
  .row .main { flex:1; display:flex; flex-direction:column; gap:3px; }
  .row .sub { font:400 14px var(--mono); color:var(--faint); }
  .row.sel .sub { color:var(--ink); opacity:.75; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--offline); border:2px solid var(--line); flex:none; }
  .dot.on { background:var(--online); }

  #pair {
    position:fixed; inset:0; z-index:80; display:none; background:var(--bg);
    align-items:center; justify-content:center;
  }
  #pair.show { display:flex; }
  #pairCard { background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); padding:40px 48px; text-align:center; max-width:760px; }
  #pairTitle { font:800 34px/1 var(--ui); color:var(--text); text-transform:uppercase; margin-bottom:12px; }
  #pairSub { font:400 17px/1.5 var(--mono); color:var(--muted); margin-bottom:26px; }
  #pairQr { width:300px; height:300px; background:#fff; padding:12px; box-sizing:border-box; border:var(--bw) solid var(--line); }
  #pairUrl { margin-top:20px; font:700 24px/1 var(--mono); color:var(--accent); letter-spacing:.5px; }
  #pairFoot { margin-top:22px; font:400 15px var(--mono); color:var(--faint); }
  #pairFoot b { color:var(--accent); }

  #busy {
    position:fixed; inset:0; z-index:90; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:22px; background:var(--bg);
  }
  #busy.show { display:flex; }
  .spinner { width:48px; height:48px; border:var(--bw) solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  #busy.err .spinner { border-color:var(--line); border-top-color:var(--danger); animation:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #busyMsg { font:700 20px/1.4 var(--ui); color:var(--text); text-align:center; max-width:70vw; text-transform:uppercase; letter-spacing:.5px; }
  #busy.err #busyMsg { color:var(--danger); }
</style>
</head>
<body>
  <div id="frame"><div id="term"></div></div>
  <div id="pill">▸ <b id="pillname">ali</b></div>
  <div id="hint"></div>
  <div id="bar"></div>

  <div id="menu">
    <div id="menuTitle"></div>
    <div id="menuHint"></div>
    <div id="menuList"></div>
  </div>

  <div id="busy"><div class="spinner"></div><div id="busyMsg"></div></div>

  <div id="pair">
    <div id="pairCard">
      <div id="pairTitle">Connect your tailnet</div>
      <div id="pairSub">Scan with your phone and paste your Tailscale token there — no typing on the TV.</div>
      <img id="pairQr" src="" alt="">
      <div id="pairUrl"></div>
      <div id="pairFoot">or press <b>OK</b> to type the token on the TV</div>
    </div>
  </div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
  (function () {
    var term, fit, ready = false;

    var THEME = {
      background: '#100F0D', foreground: '#F3EFE4',
      cursor: '#FF5A1F', cursorAccent: '#100F0D', selectionBackground: '#4a3016',
      black: '#100F0D', red: '#F87171', green: '#4BC55E', yellow: '#E6B34D',
      blue: '#6AA0FF', magenta: '#C79BF0', cyan: '#5CC7D6', white: '#D8D2C2',
      brightBlack: '#77715F', brightRed: '#FF8A6A', brightGreen: '#6FD97F',
      brightYellow: '#F0C56A', brightBlue: '#8FB6FF', brightMagenta: '#D6B0F5',
      brightCyan: '#7CD6E2', brightWhite: '#F3EFE4'
    };

    // feature bar actions (id, label). Native reads selection via barSel().
    var ACTIONS = [
      {id:'font_dec',  l:'A−'},
      {id:'font_inc',  l:'A+'},
      {id:'margin_dec',l:'⤢−'},
      {id:'margin_inc',l:'⤢+'},
      {id:'win_prev',  l:'◀W'},
      {id:'win_next',  l:'W▶'},
      {id:'new_win',   l:'＋W'},
      {id:'scroll',    l:'Scroll'},
      {id:'esc',       l:'Esc'},
      {id:'tab',       l:'Tab'},
      {id:'ctrlc',     l:'^C'},
      {id:'kbd',       l:'⌨'},
      {id:'detach',    l:'Detach'}
    ];
    var barSelIdx = 0;

    function buildBar() {
      var bar = document.getElementById('bar');
      bar.innerHTML = '';
      ACTIONS.forEach(function (a, i) {
        var d = document.createElement('div');
        d.className = 'item' + (i === barSelIdx ? ' sel' : '');
        d.id = 'it' + i;
        d.textContent = a.l;
        bar.appendChild(d);
      });
    }
    function paintBar() {
      ACTIONS.forEach(function (a, i) {
        var el = document.getElementById('it' + i);
        if (el) el.className = 'item' + (i === barSelIdx ? ' sel' : '');
      });
      var sel = document.getElementById('it' + barSelIdx);
      if (sel && sel.scrollIntoView) sel.scrollIntoView({block:'nearest', inline:'center'});
    }

    var hintTimer = null;
    function flash(big, small) {
      var h = document.getElementById('hint');
      h.innerHTML = big + (small ? '<small>' + small + '</small>' : '');
      h.classList.add('show');
      if (hintTimer) clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ h.classList.remove('show'); }, 900);
    }

    function reportSize() {
      if (!term) return;
      try { Bridge.resize(term.cols, term.rows); } catch (e) {}
    }
    function doFit() {
      try { fit.fit(); } catch (e) {}
      reportSize();
    }

    function b64ToBytes(b64) {
      var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
      for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // ---- API called FROM native ----
    window.API = {
      write: function (b64) { if (term) term.write(b64ToBytes(b64)); },
      setFont: function (px) {
        term.options.fontSize = px;
        doFit();
        flash('A ' + px + 'px');
      },
      setMargin: function (px) {
        document.documentElement.style.setProperty('--margin', px + 'px');
        setTimeout(doFit, 140);
        flash('margin ' + px);
      },
      refit: doFit,
      showBar: function (on) {
        document.getElementById('bar').classList.toggle('show', !!on);
        if (on) paintBar();
      },
      barMove: function (d) {
        barSelIdx = (barSelIdx + d + ACTIONS.length) % ACTIONS.length;
        paintBar();
      },
      barSel: function () { return ACTIONS[barSelIdx].id; },
      flash: flash,
      setSession: function (n) { document.getElementById('pillname').textContent = n; },

      // ---- launcher menu ----
      showMenu: function (title, hint, itemsJson) {
        menuItems = JSON.parse(itemsJson);
        menuIdx = 0;
        document.getElementById('menuTitle').innerHTML = title;
        document.getElementById('menuHint').textContent = hint || '';
        var list = document.getElementById('menuList');
        list.innerHTML = '';
        menuItems.forEach(function (it, i) {
          var row = document.createElement('div');
          row.className = 'row' + (i === menuIdx ? ' sel' : '');
          row.id = 'row' + i;
          var dot = it.dot ? '<div class="dot ' + it.dot + '"></div>' : '<div style="width:10px"></div>';
          var sub = it.sub ? '<div class="sub">' + it.sub + '</div>' : '';
          row.innerHTML = dot +
            '<div class="ico">' + (it.ico || '') + '</div>' +
            '<div class="main"><div>' + it.label + '</div>' + sub + '</div>';
          list.appendChild(row);
        });
        document.getElementById('menu').classList.add('show');
      },
      hideMenu: function () { document.getElementById('menu').classList.remove('show'); },
      menuMove: function (d) {
        if (!menuItems.length) return;
        menuIdx = (menuIdx + d + menuItems.length) % menuItems.length;
        menuItems.forEach(function (it, i) {
          var el = document.getElementById('row' + i);
          if (el) el.className = 'row' + (i === menuIdx ? ' sel' : '');
        });
        var sel = document.getElementById('row' + menuIdx);
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
      },
      menuSel: function () { return menuItems.length ? menuItems[menuIdx].id : ''; },

      // ---- phone pairing ----
      showPair: function (url, qrDataUri) {
        document.getElementById('pairUrl').textContent = url;
        document.getElementById('pairQr').src = qrDataUri;
        document.getElementById('pair').classList.add('show');
      },
      hidePair: function () { document.getElementById('pair').classList.remove('show'); },

      // ---- busy / error overlay ----
      busy: function (msg) {
        var b = document.getElementById('busy');
        b.classList.remove('err'); b.classList.add('show');
        document.getElementById('busyMsg').textContent = msg;
      },
      error: function (msg) {
        var b = document.getElementById('busy');
        b.classList.add('err'); b.classList.add('show');
        document.getElementById('busyMsg').textContent = msg;
      },
      idle: function () { document.getElementById('busy').classList.remove('show'); }
    };

    var menuItems = [], menuIdx = 0;

    function boot() {
      term = new Terminal({
        allowProposedApi: true,
        fontFamily: '"JetBrains Mono", monospace',
        fontSize: 17,
        fontWeight: 400,
        fontWeightBold: 700,
        lineHeight: 1.12,
        letterSpacing: 0,
        cursorBlink: true,
        cursorStyle: 'block',
        scrollback: 5000,
        theme: THEME,
        allowTransparency: true
      });
      fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('term'));
      buildBar();
      doFit();

      term.onData(function (d) { try { Bridge.input(d); } catch (e) {} });
      window.addEventListener('resize', doFit);

      ready = true;
      try { Bridge.ready(); } catch (e) {}
    }

    // wait for the bundled font so cell metrics are correct
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('400 17px "JetBrains Mono"'),
        document.fonts.load('700 17px "JetBrains Mono"')
      ]).then(boot).catch(boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
