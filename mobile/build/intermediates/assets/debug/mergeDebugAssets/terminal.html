<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family:'JetBrains Mono'; font-weight:400; src:url('jbmono-regular.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:700; src:url('jbmono-bold.woff2') format('woff2'); }
  :root { --bg:#1a1b26; --bg2:#16161e; --fg:#c0caf5; --accent:#7aa2f7; --accent2:#bb9af7; --green:#9ece6a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg2); color:var(--fg);
    font-family:'JetBrains Mono',monospace; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100%; }

  #topbar { display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:#16161e; border-bottom:1px solid #262a40; }
  #title { flex:1; font-weight:700; font-size:16px; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #title b { color: var(--green); }
  .tb { background:#20233a; color:#aab2d8; border:1px solid #2a2e46; border-radius:10px;
    padding:9px 12px; font:600 14px 'JetBrains Mono',monospace; }
  .tb:active { background:#2a2e46; }

  #term { flex:1; min-height:0; padding:8px 10px; background:var(--bg); }
  .xterm { height:100%; }
  .xterm-viewport::-webkit-scrollbar { width:0; }

  #keys { display:flex; gap:6px; padding:6px 8px; overflow-x:auto; background:#13141b; border-top:1px solid #21263c; }
  #keys button { flex:0 0 auto; min-width:46px; height:40px; border-radius:9px;
    background:#20233a; color:#c0caf5; border:1px solid #2a2e46; font:600 15px 'JetBrains Mono',monospace; }
  #keys button:active { background:var(--accent); color:#0b0f12; }

  #inbar { display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#0f1017; border-top:1px solid #21263c; }
  #inp { flex:1; min-width:0; background:#1b1d2c; border:1px solid #33467c; border-radius:12px;
    color:var(--fg); font:500 16px 'JetBrains Mono',monospace; padding:12px 14px; }
  #inp:focus { outline:none; border-color:var(--accent); }
  .ib { width:50px; border:0; border-radius:12px; font-size:20px; color:#0b0f12; }
  #btnMic { background:#e0af68; }
  #btnSend { background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .ib:active { filter:brightness(.9); }

  /* menus */
  #menu { position:fixed; inset:0; z-index:70; display:none; flex-direction:column;
    background:radial-gradient(120% 120% at 50% 0%, #1f2233 0%, #16161e 70%, #0d0e14 100%); }
  #menu.show { display:flex; }
  #menuHead { padding:18px 18px 10px; }
  #menuTitle { font:700 24px 'JetBrains Mono',monospace; color:var(--fg); }
  #menuTitle b { color:var(--accent); }
  #menuHint { font:400 13px 'JetBrains Mono',monospace; color:#7f88b3; margin-top:4px; }
  #menuList { flex:1; overflow-y:auto; padding:6px 14px 20px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:14px; padding:16px; border-radius:14px;
    background:#1b1d2c; border:1px solid #262a40; }
  .row:active { background:#242844; border-color:var(--accent); }
  .row .ico { width:26px; text-align:center; font-size:20px; }
  .row .main { flex:1; }
  .row .lbl { font:600 17px 'JetBrains Mono',monospace; color:#e6ebff; }
  .row .sub { font:400 12px 'JetBrains Mono',monospace; color:#6f78a0; margin-top:2px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#3a3f57; }
  .dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.off { background:#414868; }

  /* busy */
  #busy { position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; background:rgba(13,14,20,.66); }
  #busy.show { display:flex; }
  .spinner { width:48px; height:48px; border-radius:50%; border:5px solid #2a2e46; border-top-color:var(--accent); animation:spin .8s linear infinite; }
  #busy.err .spinner { border-color:#4b2230; border-top-color:#f7768e; animation:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #busyMsg { font:500 17px 'JetBrains Mono',monospace; color:var(--fg); text-align:center; padding:0 24px; }
  #busy.err #busyMsg { color:#f7768e; }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <button class="tb" id="btnMenu">☰</button>
      <div id="title">▸ <b id="titleName">—</b></div>
      <button class="tb" id="btnDevices">Devices</button>
    </div>
    <div id="term"></div>
    <div id="keys">
      <button data-k="esc">Esc</button>
      <button data-k="tab">Tab</button>
      <button data-k="ctrlc">^C</button>
      <button data-k="up">↑</button>
      <button data-k="down">↓</button>
      <button data-k="left">←</button>
      <button data-k="right">→</button>
    </div>
    <div id="inbar">
      <input id="inp" placeholder="type a command / message…" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             enterkeyhint="send">
      <button class="ib" id="btnMic">🎤</button>
      <button class="ib" id="btnSend">⏎</button>
    </div>
  </div>

  <div id="menu">
    <div id="menuHead"><div id="menuTitle"></div><div id="menuHint"></div></div>
    <div id="menuList"></div>
  </div>
  <div id="busy"><div class="spinner"></div><div id="busyMsg"></div></div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
  (function () {
    var term, fit;
    var THEME = {
      background:'#1a1b26', foreground:'#c0caf5', cursor:'#c0caf5', cursorAccent:'#1a1b26',
      selectionBackground:'#33467c', black:'#15161e', red:'#f7768e', green:'#9ece6a', yellow:'#e0af68',
      blue:'#7aa2f7', magenta:'#bb9af7', cyan:'#7dcfff', white:'#a9b1d6', brightBlack:'#414868',
      brightRed:'#f7768e', brightGreen:'#9ece6a', brightYellow:'#e0af68', brightBlue:'#7aa2f7',
      brightMagenta:'#bb9af7', brightCyan:'#7dcfff', brightWhite:'#c0caf5'
    };

    function b64ToBytes(b64){ var s=atob(b64),a=new Uint8Array(s.length); for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a; }
    function reportSize(){ if(term){ try{ Bridge.resize(term.cols,term.rows);}catch(e){} } }
    function doFit(){ try{ fit.fit(); }catch(e){} reportSize(); }

    var menuItems=[];
    window.API = {
      write:function(b64){ if(term) term.write(b64ToBytes(b64)); },
      refit:doFit,
      setSession:function(n){ document.getElementById('titleName').textContent=n; },
      showMenu:function(title,hint,itemsJson){
        menuItems=JSON.parse(itemsJson);
        document.getElementById('menuTitle').innerHTML=title;
        document.getElementById('menuHint').textContent=hint||'';
        var list=document.getElementById('menuList'); list.innerHTML='';
        menuItems.forEach(function(it){
          var row=document.createElement('div'); row.className='row';
          var dot= it.dot ? '<div class="dot '+it.dot+'"></div>' : '<div style="width:10px"></div>';
          var sub= it.sub ? '<div class="sub">'+it.sub+'</div>' : '';
          row.innerHTML=dot+'<div class="ico">'+(it.ico||'')+'</div><div class="main"><div class="lbl">'+it.label+'</div>'+sub+'</div>';
          row.onclick=function(){ try{ Bridge.pick(it.id); }catch(e){} };
          list.appendChild(row);
        });
        document.getElementById('menu').classList.add('show');
      },
      hideMenu:function(){ document.getElementById('menu').classList.remove('show'); },
      busy:function(m){ var b=document.getElementById('busy'); b.classList.remove('err'); b.classList.add('show'); document.getElementById('busyMsg').textContent=m; },
      error:function(m){ var b=document.getElementById('busy'); b.classList.add('err','show'); document.getElementById('busyMsg').textContent=m; },
      idle:function(){ document.getElementById('busy').classList.remove('show'); },
      focusInput:function(){ document.getElementById('inp').focus(); }
    };

    function wire(){
      var inp=document.getElementById('inp');
      function send(){ var v=inp.value; if(v.length){ try{Bridge.sendLine(v);}catch(e){} } inp.value=''; }
      document.getElementById('btnSend').onclick=send;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); send(); }});
      document.getElementById('btnMic').onclick=function(){ try{Bridge.voice();}catch(e){} };
      document.getElementById('btnMenu').onclick=function(){ try{Bridge.openActions();}catch(e){} };
      document.getElementById('btnDevices').onclick=function(){ try{Bridge.openDevices();}catch(e){} };
      Array.prototype.forEach.call(document.querySelectorAll('#keys button'),function(b){
        b.onclick=function(){ try{Bridge.key(b.getAttribute('data-k'));}catch(e){} };
      });
    }

    function boot(){
      term=new Terminal({ allowProposedApi:true, fontFamily:'"JetBrains Mono",monospace', fontSize:15,
        lineHeight:1.1, cursorBlink:true, cursorStyle:'block', scrollback:5000, theme:THEME, allowTransparency:true });
      fit=new FitAddon.FitAddon(); term.loadAddon(fit);
      term.open(document.getElementById('term'));
      doFit();
      term.onData(function(d){ try{Bridge.input(d);}catch(e){} });
      window.addEventListener('resize',doFit);
      wire();
      try{ Bridge.ready(); }catch(e){}
    }
    if(document.fonts&&document.fonts.load){
      Promise.all([document.fonts.load('400 15px "JetBrains Mono"'),document.fonts.load('700 15px "JetBrains Mono"')]).then(boot).catch(boot);
    } else boot();
  })();
  </script>
</body>
</html>
