<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family:'JetBrains Mono'; font-weight:400; src:url('jbmono-regular.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:700; src:url('jbmono-bold.woff2') format('woff2'); }
  :root {
    --bg:#0B0D11; --surface:#14171C; --surface-2:#1C2027;
    --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.16);
    --text:#E8EBEF; --muted:#9AA1AB; --faint:#5C636D;
    --accent:#5B9CFF; --accent-soft:rgba(91,156,255,0.12); --ink:#0A0D12;
    --online:#35D07F; --danger:#FF6B6B;
    --sans:-apple-system,"Roboto","Segoe UI",system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  /* only the text field is selectable/editable */
  #inp { -webkit-user-select:text; user-select:text; }
  #app { display:flex; flex-direction:column; height:100%; }

  /* top bar */
  #topbar { display:flex; align-items:center; gap:10px; padding:11px 14px;
    background:var(--surface); border-bottom:1px solid var(--line); }
  #title { flex:1; font:500 15px/1.2 var(--mono); color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #title b { color:var(--accent); font-weight:600; }
  .tb { background:transparent; color:var(--muted); border:1px solid var(--line-2); border-radius:8px;
    padding:8px 12px; font:600 13px var(--sans); letter-spacing:.2px; }
  .tb:active { background:var(--surface-2); color:var(--text); }

  #term { flex:1; min-height:0; padding:8px 10px; background:var(--bg); touch-action:none; position:relative; }
  .xterm { height:100%; }
  .xterm-viewport::-webkit-scrollbar { width:0; }

  /* quick keys */
  #keys { display:flex; gap:6px; padding:7px 8px; overflow-x:auto; background:var(--surface); border-top:1px solid var(--line); }
  #keys button { flex:0 0 auto; min-width:44px; height:38px; padding:0 12px; border-radius:8px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line); font:600 13px var(--mono);
    display:inline-flex; align-items:center; justify-content:center; }
  #keys button svg { width:19px; height:19px; display:block; }
  #keys button:active { background:var(--accent); color:var(--ink); border-color:transparent; }

  /* finder — window pills + pane wireframe map (reserves its own space) */
  #finder { display:none; flex-direction:column; align-items:center; gap:8px; padding:9px 10px;
    background:var(--surface); border-top:1px solid var(--line); }
  #finder.show { display:flex; }
  #winbar { display:flex; gap:6px; overflow-x:auto; max-width:100%; }
  .win { flex:0 0 auto; padding:5px 11px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line);
    font:600 12px/1 var(--mono); color:var(--muted); white-space:nowrap; }
  .win .wn { color:var(--faint); margin-right:6px; }
  .win.active { background:var(--accent); color:var(--ink); border-color:transparent; }
  .win.active .wn { color:var(--ink); opacity:.7; }
  #map { position:relative; height:66px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .pv { position:absolute; box-sizing:border-box; border:1px solid var(--line-2); border-radius:3px; background:var(--surface-2);
    font:600 11px/1.1 var(--mono); color:var(--muted); overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:1px; margin:1.5px; }
  .pv.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  #finder.edit #map { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; height:96px; }
  /* edit toolbar (hold the map to open) */
  #editbar { display:none; gap:6px; flex-wrap:wrap; justify-content:center; }
  #finder.edit #editbar { display:flex; }
  #editbar button { height:38px; min-width:40px; padding:0 12px; border-radius:8px;
    background:var(--surface-2); color:var(--text); border:1px solid var(--line-2);
    font:600 14px var(--mono); display:inline-flex; align-items:center; justify-content:center; }
  #editbar button.wide { font:600 13px var(--sans); letter-spacing:.2px; }
  #editbar button:active { background:var(--accent); color:var(--ink); border-color:transparent; }
  #editbar button.done { background:var(--accent); color:var(--ink); border-color:transparent; }

  /* input bar */
  #inbar { display:flex; gap:8px; padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line); }
  #inp { flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    color:var(--text); font:500 15px var(--mono); padding:11px 13px; }
  #inp::placeholder { color:var(--faint); }
  #inp:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .ib { width:46px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); color:var(--muted);
    display:flex; align-items:center; justify-content:center; }
  .ib svg { width:21px; height:21px; }
  #btnSend { background:var(--accent); border-color:transparent; color:var(--ink); }
  .ib:active { filter:brightness(1.1); }

  /* full-screen menus (devices / sessions / actions) */
  #menu { position:fixed; inset:0; z-index:70; display:none; flex-direction:column; background:var(--bg); }
  #menu.show { display:flex; }
  #menuHead { padding:22px 18px 12px; border-bottom:1px solid var(--line); }
  #menuTitle { font:700 22px/1.1 var(--sans); color:var(--text); letter-spacing:-.2px; }
  #menuTitle b { color:var(--accent); font-weight:700; }
  #menuHint { font:600 11px/1 var(--mono); color:var(--faint); margin-top:7px; text-transform:uppercase; letter-spacing:1.2px; }
  #menuList { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:13px; padding:14px 15px; border-radius:10px;
    background:var(--surface); border:1px solid var(--line); }
  .row:active { background:var(--surface-2); border-color:var(--line-2); }
  .row .ico { width:22px; text-align:center; font-size:17px; color:var(--muted); }
  .row .main { flex:1; min-width:0; }
  .row .lbl { font:500 16px/1.25 var(--mono); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { font:400 12px/1.3 var(--mono); color:var(--faint); margin-top:3px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.on { background:var(--online); box-shadow:0 0 0 3px rgba(53,208,127,0.18); }
  .dot.off { background:#333941; }

  /* busy / error */
  #busy { position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:rgba(11,13,17,.72); }
  #busy.show { display:flex; }
  .spinner { width:40px; height:40px; border-radius:50%; border:3px solid var(--line-2); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  #busy.err .spinner { border-color:rgba(255,107,107,.25); border-top-color:var(--danger); animation:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #busyMsg { font:500 15px var(--sans); color:var(--muted); text-align:center; padding:0 28px; }
  #busy.err #busyMsg { color:var(--danger); }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <button class="tb" id="btnMenu">☰</button>
      <div id="title">▸ <b id="titleName">—</b></div>
      <button class="tb" id="btnDevices">Devices</button>
    </div>
    <div id="term"></div>
    <div id="finder">
      <div id="winbar"></div>
      <div id="mapwrap"></div>
      <div id="editbar">
        <button data-e="grow-l" aria-label="Grow left">◀</button>
        <button data-e="grow-d" aria-label="Grow down">▼</button>
        <button data-e="grow-u" aria-label="Grow up">▲</button>
        <button data-e="grow-r" aria-label="Grow right">▶</button>
        <button data-e="layout" class="wide">Layout</button>
        <button data-e="swap" class="wide">Swap</button>
        <button data-e="done" class="wide done">Done</button>
      </div>
    </div>
    <div id="keys">
      <button data-k="__kbd" aria-label="Keyboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
      <button data-k="esc">Esc</button>
      <button data-k="tab">Tab</button>
      <button data-k="stab">S-Tab</button>
      <button data-k="ctrlc">^C</button>
      <button data-k="up">↑</button>
      <button data-k="down">↓</button>
      <button data-k="left">←</button>
      <button data-k="right">→</button>
    </div>
    <div id="inbar">
      <input id="inp" placeholder="type a command / message…" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             enterkeyhint="send">
      <button class="ib" id="btnMic" aria-label="Voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="ib" id="btnSend" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
      </button>
    </div>
  </div>

  <div id="menu">
    <div id="menuHead"><div id="menuTitle"></div><div id="menuHint"></div></div>
    <div id="menuList"></div>
  </div>
  <div id="busy"><div class="spinner"></div><div id="busyMsg"></div></div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
  (function () {
    var term, fit;
    var THEME = {
      background:'#0B0D11', foreground:'#E8EBEF', cursor:'#5B9CFF', cursorAccent:'#0B0D11',
      selectionBackground:'#2A3A55', black:'#0B0D11', red:'#F87171', green:'#35D07F', yellow:'#E0AF68',
      blue:'#5B9CFF', magenta:'#B58BF0', cyan:'#56C7D6', white:'#C7CDD5', brightBlack:'#5C636D',
      brightRed:'#F87171', brightGreen:'#35D07F', brightYellow:'#E0AF68', brightBlue:'#7FB4FF',
      brightMagenta:'#B58BF0', brightCyan:'#56C7D6', brightWhite:'#E8EBEF'
    };

    function b64ToBytes(b64){ var s=atob(b64),a=new Uint8Array(s.length); for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a; }
    function reportSize(){ if(term){ try{ Bridge.resize(term.cols,term.rows);}catch(e){} } }
    function doFit(){ try{ fit.fit(); }catch(e){} reportSize(); }

    var menuItems=[];
    window.API = {
      write:function(b64){ if(term) term.write(b64ToBytes(b64)); },
      refit:doFit,
      setSession:function(n){ document.getElementById('titleName').textContent=n; },
      showMenu:function(title,hint,itemsJson){
        menuItems=JSON.parse(itemsJson);
        document.getElementById('menuTitle').innerHTML=title;
        document.getElementById('menuHint').textContent=hint||'';
        var list=document.getElementById('menuList'); list.innerHTML='';
        menuItems.forEach(function(it){
          var row=document.createElement('div'); row.className='row';
          var dot= it.dot ? '<div class="dot '+it.dot+'"></div>' : '<div style="width:10px"></div>';
          var sub= it.sub ? '<div class="sub">'+it.sub+'</div>' : '';
          row.innerHTML=dot+'<div class="ico">'+(it.ico||'')+'</div><div class="main"><div class="lbl">'+it.label+'</div>'+sub+'</div>';
          row.onclick=function(){ try{ Bridge.pick(it.id); }catch(e){} };
          list.appendChild(row);
        });
        document.getElementById('menu').classList.add('show');
      },
      hideMenu:function(){ document.getElementById('menu').classList.remove('show'); },
      busy:function(m){ var b=document.getElementById('busy'); b.classList.remove('err'); b.classList.add('show'); document.getElementById('busyMsg').textContent=m; },
      error:function(m){ var b=document.getElementById('busy'); b.classList.add('err','show'); document.getElementById('busyMsg').textContent=m; },
      idle:function(){ document.getElementById('busy').classList.remove('show'); },
      focusInput:function(){ document.getElementById('inp').focus(); },
      setLayout:function(json){
        var d=JSON.parse(json);
        var f=document.getElementById('finder');
        var wb=document.getElementById('winbar'); wb.innerHTML='';
        var mw=document.getElementById('mapwrap'); mw.innerHTML='';
        if(!d.windows||!d.windows.length){ f.classList.remove('show'); setTimeout(doFit,30); return; }
        f.classList.add('show');
        d.windows.forEach(function(w){
          var el=document.createElement('div'); el.className='win'+(w.active?' active':''); el.dataset.idx=w.idx;
          el.innerHTML='<span class="wn">'+w.idx+'</span>'+(w.name||'');
          el.onclick=function(){ try{Bridge.selectWindow(w.idx);}catch(e){} };
          wb.appendChild(el);
          if(w.active && el.scrollIntoView) el.scrollIntoView({inline:'center',block:'nearest'});
        });
        if(d.panes&&d.panes.length){
          var W=d.w||1, H=d.h||1, mapH=70;
          var mapW=Math.max(90, Math.min(300, Math.round(mapH*(W*0.5)/H)));  // cells ~1w:2h
          var map=document.createElement('div'); map.id='map';
          map.style.width=mapW+'px'; map.style.height=mapH+'px';
          d.panes.forEach(function(p){
            var el=document.createElement('div'); el.className='pv'+(p.active?' active':''); el.dataset.id=p.id;
            el.style.left=(100*p.x/W)+'%'; el.style.top=(100*p.y/H)+'%';
            el.style.width=(100*p.pw/W)+'%'; el.style.height=(100*p.ph/H)+'%';
            el.textContent=p.cmd||p.label;
            el.onclick=function(){
              if(document.getElementById('finder').classList.contains('edit')){ try{Bridge.editSelectPane(p.id);}catch(e){} }
              else try{Bridge.selectPane(p.id);}catch(e){}
            };
            map.appendChild(el);
          });
          mw.appendChild(map);
        }
        setTimeout(doFit,30);   // terminal shrinks to fit above the finder
      },
      setActivePane:function(id){
        Array.prototype.forEach.call(document.querySelectorAll('#finder .pv'),function(el){
          el.classList.toggle('active', el.dataset.id===String(id));
        });
      },
      setActiveWindow:function(idx){
        Array.prototype.forEach.call(document.querySelectorAll('#winbar .win'),function(el){
          el.classList.toggle('active', el.dataset.idx===String(idx));
        });
      }
    };

    function wire(){
      var inp=document.getElementById('inp');
      function send(){ var v=inp.value; if(v.length){ try{Bridge.sendLine(v);}catch(e){} } inp.value=''; }
      document.getElementById('btnSend').onclick=send;
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ if(e.cancelable)e.preventDefault(); send(); }});
      document.getElementById('btnMic').onclick=function(){ try{Bridge.voice();}catch(e){} };
      document.getElementById('btnMenu').onclick=function(){ try{Bridge.openActions();}catch(e){} };
      document.getElementById('btnDevices').onclick=function(){ try{Bridge.openDevices();}catch(e){} };
      Array.prototype.forEach.call(document.querySelectorAll('#keys button'),function(b){
        b.onclick=function(){
          var k=b.getAttribute('data-k');
          if(k==='__kbd'){
            // type straight into the active pane (not the input field)
            var ta=document.querySelector('.xterm-helper-textarea');
            if(ta){ ta.removeAttribute('readonly'); ta.setAttribute('inputmode','text'); }
            term.focus();
            try{Bridge.showKeyboard();}catch(e){}
          }
          else try{Bridge.key(k);}catch(e){}
        };
      });

      // hold the pane map to open edit mode (resize / layout / swap)
      var finder=document.getElementById('finder'), mapwrap=document.getElementById('mapwrap'), lp=null;
      function cancelLp(){ if(lp){ clearTimeout(lp); lp=null; } }
      mapwrap.addEventListener('touchstart',function(){
        if(finder.classList.contains('edit')) return;
        lp=setTimeout(function(){ lp=null; finder.classList.add('edit'); setTimeout(doFit,40); try{Bridge.editEnter();}catch(e){} },450);
      },{passive:true});
      mapwrap.addEventListener('touchend',cancelLp);
      mapwrap.addEventListener('touchmove',cancelLp);
      Array.prototype.forEach.call(document.querySelectorAll('#editbar button'),function(b){
        b.onclick=function(){
          var e=b.getAttribute('data-e');
          if(e==='done'){ finder.classList.remove('edit'); setTimeout(doFit,40); try{Bridge.editExit();}catch(x){} }
          else try{Bridge.paneEdit(e);}catch(x){}
        };
      });
    }

    function boot(){
      term=new Terminal({ allowProposedApi:true, fontFamily:'"JetBrains Mono",monospace', fontSize:15,
        lineHeight:1.1, cursorBlink:true, cursorStyle:'block', scrollback:5000, theme:THEME, allowTransparency:true });
      fit=new FitAddon.FitAddon(); term.loadAddon(fit);
      term.open(document.getElementById('term'));
      // stop xterm's hidden textarea from popping the soft keyboard on every tap;
      // the keyboard only opens via the keyboard button (which focuses #inp).
      var ta=document.querySelector('.xterm-helper-textarea');
      if(ta){
        ta.setAttribute('inputmode','none'); ta.setAttribute('readonly','readonly');
        // when the keyboard closes, go back to no-keyboard-on-tap
        ta.addEventListener('blur',function(){ ta.setAttribute('inputmode','none'); ta.setAttribute('readonly','readonly'); });
      }
      doFit();
      term.onData(function(d){ try{Bridge.input(d);}catch(e){} });
      window.addEventListener('resize',doFit);
      wire();
      gestures();
      try{ Bridge.ready(); }catch(e){}
    }

    function gestures(){
      var el=document.getElementById('term');
      var g=null, s1=null;
      function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
      function cen(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
      el.addEventListener('touchstart',function(e){
        if(e.touches.length===2){ var c=cen(e.touches); g={d0:dist(e.touches),cx:c.x,cy:c.y,fs0:term.options.fontSize,fired:false}; s1=null; if(e.cancelable)e.preventDefault(); }
        else if(e.touches.length===1){ s1={y:e.touches[0].clientY,moved:false}; }
      },{passive:false});
      el.addEventListener('touchmove',function(e){
        if(g && e.touches.length===2){ if(e.cancelable)e.preventDefault();
          var d=dist(e.touches), c=cen(e.touches), dd=d-g.d0, mx=c.x-g.cx, my=c.y-g.cy;
          if(Math.abs(dd)>40 && Math.abs(dd)>Math.hypot(mx,my)){            // pinch -> font
            var ns=Math.max(8,Math.min(40, g.fs0 + Math.round(dd/45)));
            if(ns!==term.options.fontSize){ term.options.fontSize=ns; try{fit.fit();}catch(_){ } reportSize(); }
          } else if(!g.fired && Math.hypot(mx,my)>70){                       // two-finger drag -> switch pane
            var delta=(Math.abs(mx)>Math.abs(my)) ? (mx>0?1:-1) : (my>0?1:-1);
            try{Bridge.paneStep(delta);}catch(_){ } g.fired=true;
          }
          return;
        }
        if(s1 && e.touches.length===1){                                     // one-finger drag -> scroll history
          var y=e.touches[0].clientY, dy=y-s1.y, lh=term.options.fontSize*1.1;
          var lines=Math.trunc(dy/lh);
          if(lines!==0){ if(e.cancelable)e.preventDefault(); s1.moved=true; try{Bridge.scroll(lines);}catch(_){ } s1.y=y; }
        }
      },{passive:false});
      function end(e){
        if(s1 && !s1.moved && e.touches.length===0){ try{Bridge.scrollExit();}catch(_){ } }
        if(e.touches.length<2) g=null;
        if(e.touches.length===0) s1=null;
      }
      el.addEventListener('touchend',end); el.addEventListener('touchcancel',end);
    }
    if(document.fonts&&document.fonts.load){
      Promise.all([document.fonts.load('400 15px "JetBrains Mono"'),document.fonts.load('700 15px "JetBrains Mono"')]).then(boot).catch(boot);
    } else boot();
  })();
  </script>
</body>
</html>
